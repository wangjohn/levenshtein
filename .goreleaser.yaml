version: 2
project_name: levenshtein
builds:
  - main: ./cmd/levenshtein
    binary: levenshtein
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/wangjohn/levenshtein/internal/buildinfo.Version={{.Version}} -X github.com/wangjohn/levenshtein/internal/buildinfo.Commit={{.FullCommit}}
archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CODE_OF_CONDUCT.md
      - AGENTS.md
      - templates/**
      - docs/**
      - dagger.json
      - .dagger-version
      - .go-version
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - runner/main.go
      - runner/checks.go
      - runner/mutation.go
      - runner/zizmor.go
      - runner/gocheck.go
      - runner/releases.go
      - runner/shelllint.go
      - runner/secrets.go
      - runner/depsvuln.go
      - runner/community.go
      - runner/internal/checktool/*.go
      - runner/rule-modules.json
      - runner/go.mod
      - runner/go.sum
      - runner/toolchain.json
      - runner/tools/**
      - sdk/patched-go/dagger.json
      - sdk/patched-go/pyproject.toml
      - sdk/patched-go/uv.lock
      - sdk/patched-go/src/**/*.py
      - sdk/patched-go/README.md
      - sdk/patched-go/patch-generator.sh
      - sdk/patched-go/generator-compat.go.txt
      - sdk/patched-go/test_prepared.py
      - sdk/patched-go/otel-go/**
      - runner/lint/**
      - runner/community/**
      - runner/testdata/**
sboms:
  - artifacts: archive
checksum:
  name_template: checksums.txt
release:
  draft: true
