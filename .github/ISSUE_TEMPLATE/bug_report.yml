name: Bug report
description: A check, the CLI, or the runner behaved incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a suspected vulnerability here. Use private reporting, as
        described in [SECURITY.md](https://github.com/wangjohn/levenshtein/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected instead, and what you saw.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The exact command, the configuration it read, and the repository it ran against.
      placeholder: |
        ./verify pre-merge --source ./app
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report or output
      description: The JSON report or the failing output. Remove anything private first.
      render: text
    validations:
      required: false
  - type: input
    id: revision
    attributes:
      label: Levenshtein revision
      description: The commit or release archive you ran.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Go version, and container runtime
      placeholder: macOS 15.5, go1.27.1, Colima 0.8.4
    validations:
      required: true
