name: Set up the pinned Dagger CLI
description: >-
  Restore the reviewed Dagger CLI from the Actions cache, install it from the
  checked-in checksums on a miss, and add it to PATH. Used by the lint and tests
  jobs in verify.yml and by vulnerabilities.yml.

runs:
  using: composite
  steps:
    - name: Cache pinned Dagger CLI
      id: dagger-cli
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.temp }}/levenshtein-bin
        key: dagger-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.dagger-version', 'scripts/dagger-checksums.txt') }}
    - name: Install pinned Dagger
      shell: bash
      env:
        CACHE_HIT: ${{ steps.dagger-cli.outputs.cache-hit }}
      run: |
        bin="$RUNNER_TEMP/levenshtein-bin"
        if [[ "$CACHE_HIT" == true && -x "$bin/dagger" ]]; then
          "$bin/dagger" version
        else
          ./scripts/install-dagger "$bin"
        fi
        echo "$bin" >> "$GITHUB_PATH"
