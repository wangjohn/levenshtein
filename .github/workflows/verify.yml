name: Levenshtein self-checks

# Verify Levenshtein's own runner and fixtures. Application repos invoke the
# shared runner from their existing CI and own their schedules (docs/consumer-ci.md).
#
# Job layout (lint ≪ tests):
#   lint  — static ./verify branch only (early required signal)
#   tests — host race/fixtures, SDK restore/regen, self-test / main / dispatch runs,
#           consumer regressions
#   language-contracts / release-smoke — parallel siblings
#
# Generated SDK cache: exact key, defined once in .github/actions/dagger-sdk;
# readiness is a compile of the runner module (scripts/ci-dagger-sdk).
# vulnerabilities.yml still always regenerates via scripts/test-sdk-security.
#
# Verification result cache: $RUNNER_TEMP/levenshtein-verification-v1, handed to
# ./verify as --cache-dir. The key ends in github.sha and falls back through a
# prefix restore-key, so any earlier entry seeds the run and the CLI's own
# per-target fingerprinting decides what is still reusable. Keys are partitioned
# per job (verification-v1-lint-… vs verification-v1-tests-…) so lint and tests
# never write the same key. Every run saves, including failed ones. A cache
# written by a pull request run lives in that PR's merge-ref scope: only reruns
# of the same PR can restore it, and main never sees it, so a fork cannot seed
# main's entries. Entries are small JSON records, and the SDK entry is touched
# on every run, so result entries do not push it out of the 10 GB budget.
# merge_group is not one of the events that writes the default-branch cache
# scope, so its saves are invisible to main; the tests scope on main is seeded
# by schedule and workflow_dispatch runs. The other direction is open: a pull
# request, including one from a fork, can restore main's entries. They hold
# verification results and generated code, never secrets.
#
# Event → ./verify run mapping:
#   Draft PR / push main     → lint: branch; tests: no Dagger verify run
#   Ready PR / merge_group   → lint: branch; tests: self-test
#   Schedule                 → lint: branch; tests: main (fresh + go-vuln)
#   workflow_dispatch        → lint: branch; tests: requested run (default self-test)
#
# Required-check guidance: require lint early; do not make draft progress wait on
# release-smoke or full tests. See docs/setup.md (tiered jobs + trust policy).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: Configured verification run
        default: self-test
        type: string
  schedule:
    # Fresh daily verification of Levenshtein itself.
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded pull_request runs only. Back-to-back pushes to main must
  # each keep their own run so no merge commit is left without a status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            runner/go.sum
            runner/lint/go.sum
            runner/tools/go.sum
      - name: Set up the pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Restore or generate the Dagger Go SDK
        uses: ./.github/actions/dagger-sdk
      - name: Restore verification result cache
        id: verification-results
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/levenshtein-verification-v1
          # Seed from the newest lint entry: ./verify re-fingerprints every target
          # before reusing a result, so a stale directory can only help.
          key: verification-v1-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: verification-v1-lint-${{ runner.os }}-
      - name: Lint and static checks
        id: verify-branch
        env:
          NO_COLOR: '1'
          VERIFICATION_CACHE: ${{ runner.temp }}/levenshtein-verification-v1
        run: |
          mkdir -p "$VERIFICATION_CACHE"
          ./verify branch --cache-dir "$VERIFICATION_CACHE"
      # Save whatever this run verified, pass or fail, from every event. A pull
      # request run saves into its own merge-ref scope, which main never reads.
      - name: Save verification result cache
        if: >-
          ${{ !cancelled() &&
          (steps.verify-branch.outcome == 'success' || steps.verify-branch.outcome == 'failure') &&
          steps.verification-results.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/levenshtein-verification-v1
          key: ${{ steps.verification-results.outputs.cache-primary-key }}

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            runner/go.sum
            runner/lint/go.sum
            runner/tools/go.sum
      - name: Standalone runner tests and planning
        env:
          GOTOOLCHAIN: local
        run: |
          go test -race ./...
          ./verify branch --dry-run
      - name: Go policy analyzer tests
        working-directory: runner/lint
        env:
          GOTOOLCHAIN: local
        run: go test -race ./...
      # The scripts carry no extension, so name them explicitly by shebang.
      # shellcheck ships with the ubuntu-24.04 runner image.
      - name: Shell script checks
        run: |
          mapfile -t bash_scripts < <(grep -rl '^#!/usr/bin/env bash' scripts)
          test "${#bash_scripts[@]}" -gt 0
          shellcheck verify "${bash_scripts[@]}"
      - name: Expanded check fixtures
        run: |
          ./scripts/test-checks
          ./scripts/test-tool-checks
      - name: Set up the pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Consumer source boundary
        run: go test -tags=integration ./internal/verify -run TestDaggerSourceBoundary -count=1
      - name: Restore or generate the Dagger Go SDK
        uses: ./.github/actions/dagger-sdk
      - name: Unit tests
        working-directory: runner
        env:
          GOTOOLCHAIN: local
        run: dagger run go test -count=1 ./...
      - name: Restore verification result cache
        id: verification-results
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/levenshtein-verification-v1
          # Seed from the newest tests entry: ./verify re-fingerprints every target
          # before reusing a result, so a stale directory can only help.
          key: verification-v1-tests-${{ runner.os }}-${{ github.sha }}
          restore-keys: verification-v1-tests-${{ runner.os }}-
      - name: Verify (non-lint Dagger checks)
        id: dagger-verify
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          REQUESTED_RUN: ${{ inputs.run }}
          NO_COLOR: '1'
          VERIFICATION_CACHE: ${{ runner.temp }}/levenshtein-verification-v1
        run: |
          run=
          if [[ "$EVENT" == schedule ]]; then
            run=main
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            run="$REQUESTED_RUN"
          elif [[ "$EVENT" == merge_group || ("$EVENT" == pull_request && "$DRAFT" != true) ]]; then
            run=self-test
          fi
          if [[ -z $run ]]; then
            echo 'Skipping Dagger verify on draft PR / push main (lint job covers branch).'
            echo 'ran=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ran=true' >> "$GITHUB_OUTPUT"
          mkdir -p "$VERIFICATION_CACHE"
          ./verify "$run" --cache-dir "$VERIFICATION_CACHE"
      # Save whatever this run verified, pass or fail, from every event. A pull
      # request run saves into its own merge-ref scope, which main never reads.
      - name: Save verification result cache
        if: >-
          ${{ !cancelled() &&
          steps.dagger-verify.outputs.ran == 'true' &&
          steps.verification-results.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/levenshtein-verification-v1
          key: ${{ steps.verification-results.outputs.cache-primary-key }}
      - name: Consumer regression checks
        env:
          NO_COLOR: '1'
        run: |
          ./scripts/test-consumers
          ./scripts/test-shared-checks

  language-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Install pinned fixture tools
        run: |
          ./scripts/install-fixture-tools "$RUNNER_TEMP/fixture-bin"
          echo "$RUNNER_TEMP/fixture-bin" >> "$GITHUB_PATH"
      - name: Rust and Python contract checks
        env:
          GOTOOLCHAIN: local
        run: ./scripts/test-language-contracts

  release-smoke:
    # Keep release archives off the draft-PR lint critical path; still required
    # for ready PRs, merge queue, main, schedule, and manual dispatch.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Build complete snapshot archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.1
          args: release --snapshot --clean
      - name: Test extracted Linux archive
        env:
          NO_COLOR: '1'
        run: |
          archives=(dist/levenshtein_*_linux_amd64.tar.gz)
          test "${#archives[@]}" -eq 1
          ./scripts/test-release "${archives[0]}"

  semantic-lint:
    # Advisory Jev review of the pull request. Findings never fail the run;
    # the step is skipped when the API key secret is unavailable, as on forks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Advisory semantic lint
        if: env.TYPESAFE_API_KEY != ''
        env:
          GOTOOLCHAIN: local
          NO_COLOR: '1'
        run: |
          status=0
          ./verify semantic-lint > semantic-lint.json || status=$?
          {
            echo '## Semantic lint (advisory)'
            echo '```'
            jq -r '.results[] | .stdout, (select(.error != null) | "error: " + .error)' semantic-lint.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Report skipped lint
        if: env.TYPESAFE_API_KEY == ''
        run: echo 'TYPESAFE_API_KEY is not available to this run; semantic lint was skipped.' >> "$GITHUB_STEP_SUMMARY"
