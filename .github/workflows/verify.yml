name: Levenshtein self-checks

# Verify Levenshtein's own runner and fixtures. The job layout, both caches and
# their trust policy, and what to require in branch protection are explained in
# docs/setup.md#levenshteins-own-ci. Application repos invoke the shared runner
# from their existing CI and own their schedules (docs/consumer-ci.md).
#
# Event → ./verify run mapping (branch runs its checks natively; main in Dagger):
#   Draft PR / push main     → lint: branch; tests: no Dagger verify run
#   Ready PR / merge_group   → lint: branch; tests: self-test
#   Any PR (advisory jobs)   → semantic-lint: semantic-lint; mutation: mutation
#   Schedule                 → lint: branch; tests: main (fresh + go-vuln)
#   workflow_dispatch        → lint: branch; tests: requested run (default self-test)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: Configured verification run
        default: self-test
        type: string
  schedule:
    # Fresh daily verification of Levenshtein itself.
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded pull_request runs only. Back-to-back pushes to main must
  # each keep their own run so no merge commit is left without a status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            runner/go.sum
            runner/lint/go.sum
            runner/tools/go.sum
      - name: Set up the pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Restore or generate the Dagger Go SDK
        uses: ./.github/actions/dagger-sdk
      # Only the result records are saved per commit: results/ and the stat/
      # hints. Native checks also keep built tools and Staticcheck data in this
      # directory; naming the record directories keeps those out, since an
      # exclusion (!path) does not apply beneath a directory the pattern already
      # includes. Staticcheck has its own cache below, and the tools rebuild from
      # the Go build cache in seconds.
      - name: Restore verification result cache
        id: verification-results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/levenshtein-verification-v1/results
            ${{ runner.temp }}/levenshtein-verification-v1/stat
          # Seed from the newest lint entry: ./verify re-fingerprints every target
          # before reusing a result, so a stale directory can only help.
          key: verification-v1-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: verification-v1-lint-${{ runner.os }}-
      # Staticcheck salts every entry with a hash of the linter binary, so an
      # entry built by another linter can never be reused, only missed. Keying on
      # everything that builds the linter (Go, its module, its source, the rule
      # list) starts a fresh cache instead of carrying dead entries. One cache
      # serves every commit; only main and the schedule write it.
      - name: Restore Staticcheck cache
        id: staticcheck-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/levenshtein-verification-v1/staticcheck
          key: staticcheck-v1-${{ runner.os }}-${{ hashFiles('.go-version', 'runner/lint/**', 'runner/toolchain.json') }}-${{ github.sha }}
          restore-keys: staticcheck-v1-${{ runner.os }}-${{ hashFiles('.go-version', 'runner/lint/**', 'runner/toolchain.json') }}-
      - name: Lint and static checks
        id: verify-branch
        env:
          NO_COLOR: '1'
          VERIFICATION_CACHE: ${{ runner.temp }}/levenshtein-verification-v1
        run: |
          mkdir -p "$VERIFICATION_CACHE"
          # The report goes outside the checkout so it never lands in a
          # checked source tree while the checks run.
          ./verify branch --cache-dir "$VERIFICATION_CACHE" > "$RUNNER_TEMP/branch-report.json"
      # Timings and cache status per check, so the job's speed can be read
      # from every run rather than measured by hand.
      - name: Summarize lint checks
        id: lint-summary
        if: ${{ !cancelled() }}
        env:
          REPORT: ${{ runner.temp }}/branch-report.json
          VERIFICATION_CACHE: ${{ runner.temp }}/levenshtein-verification-v1
          STATICCHECK_CACHE_DIR: ${{ runner.temp }}/levenshtein-verification-v1/staticcheck
        run: |
          if [[ -s $REPORT ]]; then
            cat "$REPORT"
            {
              echo '## Lint checks'
              echo
              echo '| Check | Status | Cache | Duration (ms) |'
              echo '| --- | --- | --- | --- |'
              jq -r '.results[] | "| \(.id) | \(.status) | \(.cache.status) | \(.duration_ms) |"' "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # The sizes of what the two save steps would store, so a cache that
          # starts carrying more than its records shows up in every run.
          records=()
          for dir in results stat; do
            [[ -d $VERIFICATION_CACHE/$dir ]] && records+=("$VERIFICATION_CACHE/$dir")
          done
          if (( ${#records[@]} > 0 )); then
            printf '\nResult cache entry: %s\n' "$(du -ch "${records[@]}" | tail -1 | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -d $STATICCHECK_CACHE_DIR ]] && [[ -n $(ls -A "$STATICCHECK_CACHE_DIR") ]]; then
            echo "staticcheck=true" >> "$GITHUB_OUTPUT"
            printf '\nStaticcheck cache: %s\n' "$(du -sh "$STATICCHECK_CACHE_DIR" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Save whatever this run verified, pass or fail, from every event. A pull
      # request run saves into its own merge-ref scope, which main never reads.
      - name: Save verification result cache
        if: >-
          ${{ !cancelled() &&
          (steps.verify-branch.outcome == 'success' || steps.verify-branch.outcome == 'failure') &&
          steps.verification-results.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/levenshtein-verification-v1/results
            ${{ runner.temp }}/levenshtein-verification-v1/stat
          key: ${{ steps.verification-results.outputs.cache-primary-key }}
      # Pull requests restore main's Staticcheck cache but never write one,
      # which bounds the entry count and keeps untrusted runs from contributing
      # analysis data.
      - name: Save Staticcheck cache
        if: >-
          ${{ !cancelled() &&
          (github.event_name == 'push' || github.event_name == 'schedule') &&
          github.ref == 'refs/heads/main' &&
          (steps.verify-branch.outcome == 'success' || steps.verify-branch.outcome == 'failure') &&
          steps.staticcheck-cache.outputs.cache-hit != 'true' &&
          steps.lint-summary.outputs.staticcheck == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/levenshtein-verification-v1/staticcheck
          key: ${{ steps.staticcheck-cache.outputs.cache-primary-key }}

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            runner/go.sum
            runner/lint/go.sum
            runner/tools/go.sum
            examples/rule-module/go.sum
      # testdata holds lint fixtures, some deliberately unformatted; LV1005
      # already enforces formatting on the checked modules through go-lint.
      - name: Go formatting
        run: |
          mapfile -t sources < <(git ls-files '*.go' ':!*/testdata/*')
          unformatted=$(gofmt -l "${sources[@]}")
          if [[ -n $unformatted ]]; then
            echo "gofmt would rewrite:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      # Module manifests (go mod tidy -diff and go mod verify) are the go-mod
      # check in the lint job's branch run, on every event this job runs for.
      - name: Python lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.16.8
          args: check
          src: |
            scripts
            sdk/patched-go
      - name: Standalone runner tests and planning
        env:
          GOTOOLCHAIN: local
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          ./verify branch --dry-run
      # No threshold gate: the profile is for reading, not for failing a run.
      - name: Upload the root module coverage profile
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-root-${{ github.run_id }}
          path: coverage.out
          retention-days: 7
          # A re-run of the same run replaces its profile instead of failing.
          overwrite: true
      - name: Go policy analyzer tests
        working-directory: runner/lint
        env:
          GOTOOLCHAIN: local
        run: go test -race ./...
      # The template community rule authors copy: its tests, and proof that
      # compiling it into the linter would move no pinned module version.
      - name: Example rule module
        env:
          GOTOOLCHAIN: local
        run: ./scripts/test-example-rules
      # The native executor runs the shared Go checks on the host, so this step
      # must stay above the Dagger setup: it proves they need no container.
      - name: Native shared Go checks
        env:
          GOTOOLCHAIN: local
        run: go test -tags=integration ./internal/verify ./cmd/levenshtein -run 'TestNativeGoChecksAgreeWithTheFixtures|TestBaselineWithNativeGoLint' -count=1
      # The scripts carry no extension, so name them explicitly by shebang.
      # shellcheck ships with the ubuntu-24.04 runner image.
      - name: Shell script checks
        run: |
          mapfile -t bash_scripts < <(grep -rl '^#!/usr/bin/env bash' scripts)
          test "${#bash_scripts[@]}" -gt 0
          shellcheck verify "${bash_scripts[@]}"
      - name: Documentation pins name the newest release
        run: ./scripts/test-doc-pins
      # Reads the enforced rulesets with this run's read-only token; see
      # docs/setup.md#required-checks-branch-protection.
      - name: Rulesets match the workflows and GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-rulesets --live
      - name: Expanded check fixtures
        run: |
          ./scripts/test-checks
          ./scripts/test-tool-checks
      - name: Set up the pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Consumer source boundary
        run: go test -tags=integration ./internal/verify -run 'TestDaggerSourceBoundary|TestMutationKeepsTheSharedDaggerSession' -count=1
      - name: Restore or generate the Dagger Go SDK
        uses: ./.github/actions/dagger-sdk
      - name: Unit tests
        working-directory: runner
        env:
          GOTOOLCHAIN: local
        run: dagger run go test -count=1 ./...
      - name: Restore verification result cache
        id: verification-results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/levenshtein-verification-v1
          # Seed from the newest tests entry: ./verify re-fingerprints every target
          # before reusing a result, so a stale directory can only help.
          key: verification-v1-tests-${{ runner.os }}-${{ github.sha }}
          restore-keys: verification-v1-tests-${{ runner.os }}-
      - name: Verify (non-lint Dagger checks)
        id: dagger-verify
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          REQUESTED_RUN: ${{ inputs.run }}
          NO_COLOR: '1'
          VERIFICATION_CACHE: ${{ runner.temp }}/levenshtein-verification-v1
        run: |
          run=
          if [[ "$EVENT" == schedule ]]; then
            run=main
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            run="$REQUESTED_RUN"
          elif [[ "$EVENT" == merge_group || ("$EVENT" == pull_request && "$DRAFT" != true) ]]; then
            run=self-test
          fi
          if [[ -z $run ]]; then
            echo 'Skipping Dagger verify on draft PR / push main (lint job covers branch).'
            echo 'ran=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ran=true' >> "$GITHUB_OUTPUT"
          mkdir -p "$VERIFICATION_CACHE"
          ./verify "$run" --cache-dir "$VERIFICATION_CACHE"
      # Save whatever this run verified, pass or fail, from every event. A pull
      # request run saves into its own merge-ref scope, which main never reads.
      - name: Save verification result cache
        if: >-
          ${{ !cancelled() &&
          steps.dagger-verify.outputs.ran == 'true' &&
          steps.verification-results.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/levenshtein-verification-v1
          key: ${{ steps.verification-results.outputs.cache-primary-key }}
      - name: Consumer regression checks
        env:
          NO_COLOR: '1'
        run: |
          ./scripts/test-consumers
          ./scripts/test-shared-checks

  language-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Install pinned fixture tools
        run: |
          ./scripts/install-fixture-tools "$RUNNER_TEMP/fixture-bin"
          echo "$RUNNER_TEMP/fixture-bin" >> "$GITHUB_PATH"
      - name: Rust and Python contract checks
        env:
          GOTOOLCHAIN: local
        run: ./scripts/test-language-contracts

  action:
    # The root action.yml exactly as a consumer calls it, on a native fixture
    # so no container runtime is involved.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify a passing consumer
        id: passing
        uses: ./
        with:
          run: pre-merge
          source: tests/fixtures/action
      - name: Plant a lint finding
        run: |
          cat > tests/fixtures/action/broken.go <<'EOF'
          package greeting

          import "os"

          // Size defers Close before checking the Open error.
          func Size(path string) int64 {
          	f, err := os.Open(path)
          	defer f.Close()
          	if err != nil {
          		return 0
          	}
          	return 1
          }
          EOF
      - name: Verify a failing consumer
        id: failing
        continue-on-error: true
        uses: ./
        with:
          run: pre-merge
          source: tests/fixtures/action
          setup-go: 'false'
          cache: 'false'
          sarif: ${{ runner.temp }}/levenshtein.sarif
      - name: The action reported the finding and failed
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          REPORT: ${{ steps.failing.outputs.report }}
          SARIF: ${{ steps.failing.outputs.sarif }}
          PASSING_RUN: ${{ steps.passing.outputs.run }}
          PASSING_SARIF: ${{ steps.passing.outputs.sarif }}
        run: |
          test "$PASSING_RUN" = pre-merge
          test -z "$PASSING_SARIF"
          test "$OUTCOME" = failure
          jq -e '.results[] | select(.id == "lint") | .status == "failed"' "$REPORT"
          grep -q '"code": "SA5001"' "$REPORT"
          jq -e '.runs[0].results[] | select(.ruleId == "SA5001") | .locations[0].physicalLocation.artifactLocation.uri == "tests/fixtures/action/broken.go"' "$SARIF"

  release-smoke:
    # Keep release archives off the draft-PR lint critical path; still required
    # for ready PRs, merge queue, main, schedule, and manual dispatch.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No module cache: this job builds the same artifacts the release
      # workflow publishes, and a restored cache entry is writable by any
      # earlier run of this workflow.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      # The release workflow runs the same configuration for real; catch a
      # broken .goreleaser.yaml here rather than on a tag.
      - name: Validate the release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.1
          args: check
      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0
      - name: Build complete snapshot archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.1
          args: release --snapshot --clean
      - name: Test extracted Linux archive
        env:
          NO_COLOR: '1'
        run: |
          archives=(dist/levenshtein_*_linux_amd64.tar.gz)
          test "${#archives[@]}" -eq 1
          ./scripts/test-release "${archives[0]}"

  semantic-lint:
    # Advisory Jev review of the pull request. Findings never fail the run;
    # the step is skipped when the API key secret is unavailable, as on forks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Advisory semantic lint
        if: env.TYPESAFE_API_KEY != ''
        env:
          GOTOOLCHAIN: local
          NO_COLOR: '1'
        run: |
          status=0
          ./verify semantic-lint > semantic-lint.json || status=$?
          {
            echo '## Semantic lint (advisory)'
            echo '```'
            jq -r '.results[] | .stdout, (select(.error != null) | "error: " + .error)' semantic-lint.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Report skipped lint
        if: env.TYPESAFE_API_KEY == ''
        run: echo 'TYPESAFE_API_KEY is not available to this run; semantic lint was skipped.' >> "$GITHUB_STEP_SUMMARY"

  mutation:
    # go-mutation over the Go files the pull request changed (docs/mutation.md).
    # Like semantic-lint, it judges only the pull request's change, runs on
    # every pull_request event, and is not a required check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The full history, so the CLI can find the merge base with the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.sum
            runner/go.sum
            runner/lint/go.sum
            runner/tools/go.sum
      - name: Set up the pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Restore or generate the Dagger Go SDK
        uses: ./.github/actions/dagger-sdk
      - name: Mutation testing
        env:
          NO_COLOR: '1'
        run: ./verify mutation > "$RUNNER_TEMP/mutation-report.json"
      - name: Summarize mutation testing
        if: ${{ !cancelled() }}
        env:
          REPORT: ${{ runner.temp }}/mutation-report.json
        run: |
          if [[ -s $REPORT ]]; then
            cat "$REPORT"
            {
              echo '## Mutation testing'
              echo '```'
              jq -r '.results[] | .stdout, (select(.error != null) | "error: " + .error)' "$REPORT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
