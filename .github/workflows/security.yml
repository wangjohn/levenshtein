name: Security

# Supply-chain checks for the repository itself: the workflows that run the
# shared checks, this repository's OpenSSF Scorecard, and the dependencies a
# pull request adds. The shared Go vulnerability scan lives in
# vulnerabilities.yml; see docs/setup.md#levenshteins-own-ci.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory or a new zizmor audit is noticed
    # without waiting for the next pull request.
    - cron: '41 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Annotations instead of a SARIF upload: findings stay readable on pull
      # requests from forks, which cannot write security events. Findings below
      # medium severity are reported by zizmor's own defaults elsewhere; this
      # gate fails the job on medium and above.
      - name: Audit workflows and composite actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          min-severity: medium
          advanced-security: false
          annotations: true

  scorecard:
    # Scorecard reads branch protection and the published history of the
    # default branch, so it runs on main and on the weekly schedule rather
    # than on a pull request's merge ref. Results go to code scanning only;
    # publishing to the public Scorecard API would also need id-token: write.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload the Scorecard findings to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  dependency-review:
    # Only a pull request has a base and a head to compare.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action needs the repository's dependency graph, which is a
      # repository setting rather than anything a workflow can turn on. Probe
      # for it so a repository without it gets a documented skip instead of a
      # permanent red check; where it is enabled, the review below is a real
      # gate.
      - name: Check for the dependency graph
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$REPOSITORY/dependency-graph/sbom" > /dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Dependency review was skipped: this repository has no dependency graph.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Enable it under Settings → Code security to gate on added dependencies.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Review added dependencies
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
