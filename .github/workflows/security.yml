name: Security

# Supply-chain checks for the repository itself: the workflows that run the
# shared checks, this repository's OpenSSF Scorecard, and the dependencies a
# pull request adds. The shared Go vulnerability scan lives in
# vulnerabilities.yml; see docs/maintainers/ci.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # dependency-review is a required check, so it has to report in a merge
  # queue too, or a queued change would wait on it forever.
  merge_group:
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory or a new zizmor audit is noticed
    # without waiting for the next pull request.
    - cron: '41 6 * * 1'

permissions:
  contents: read

# As in verify.yml: pull requests cancel superseded runs, and every other event
# groups by commit, since GitHub cancels all but one pending run per group even
# without cancel-in-progress.
concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The shared workflow-security check runs zizmor's offline audits in the
      # verify workflow. This job adds the online ones, which use the workflow
      # token (impostor-commit, known-vulnerable-actions, ref-confusion), and
      # the weekly schedule catches new advisories. It audits the same inputs
      # as the shared check plus consumer workflow templates, keeping the
      # deliberately insecure fixture under runner/testdata out. It runs the
      # version runner/toolchain.json pins; a test keeps the two equal.
      # Annotations instead of a SARIF upload: findings stay readable on pull
      # requests from forks, which cannot write security events. This gate
      # fails the job on medium severity and above.
      - name: Audit workflows and composite actions
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: >-
            .github/workflows .github/actions action.yml .github/dependabot.yml
            templates/github/workflows/levenshtein.yml
            templates/github/workflows/levenshtein-minimal.yml
          min-severity: medium
          advanced-security: false
          annotations: true

  scorecard:
    # Scorecard reads branch protection and the published history of the
    # default branch, so it runs on main and on the weekly schedule rather
    # than on a pull request's merge ref. Results go to code scanning only;
    # publishing to the public Scorecard API would also need id-token: write.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload the Scorecard findings to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  dependency-review:
    # Only a pull request has a base and a head to compare. In a merge queue
    # the job passes without a review: the pull request it queued already had
    # one, and a required check that never reports would stall the queue.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      # Requires the repository's dependency graph (Settings -> Code security).
      # Without it the action fails, which is the intended signal.
      - name: Review added dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Pass outside pull requests
        if: github.event_name != 'pull_request'
        run: echo 'Dependencies were reviewed on the queued pull request.' >> "$GITHUB_STEP_SUMMARY"
