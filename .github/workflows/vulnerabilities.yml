name: Dependency vulnerabilities

on:
  pull_request:
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '.go-version'
      - 'runner/toolchain.json'
      - 'dagger.json'
      - '.dagger-version'
      - 'sdk/**'
      - 'scripts/test-sdk-security'
      - 'scripts/test-sdk-lock'
      - 'levenshtein.json'
      - '.github/workflows/vulnerabilities.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulnerabilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Set up the pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      # scripts/test-sdk-security checks the SDK adapter's lock with uv first.
      - name: Install the reviewed uv
        run: |
          ./scripts/install-fixture-tools --uv-only "$RUNNER_TEMP/uv-bin"
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"
      - name: Verify SDK regeneration and scan the generated and tool executables
        run: ./scripts/test-sdk-security
      - name: Scan configured Go modules
        run: ./verify go-vuln
      - name: Scan the SDK adapter's locked Python dependencies
        run: ./verify deps-vuln
