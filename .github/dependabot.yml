version: 2
updates:
  # Workflows and the composite actions under .github/actions. Every action is
  # SHA-pinned; Dependabot updates pinned SHAs and their version comments.
  # Every ecosystem waits a week after a release before proposing it, so a
  # compromised or withdrawn version is usually gone before a PR opens.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # runner/go.mod is managed by `dagger develop`, which rewrites it on every
  # regeneration, and its OpenTelemetry replace directives are pinned on
  # purpose (scripts/test-sdk-security fails on any other version). Its
  # generated sources are gitignored, so Dependabot could not resolve the module
  # anyway. Bump it by changing .dagger-version and regenerating.

  # Staticcheck (honnef.co/go/tools) is ignored here and in runner/community:
  # both must stay on the pin runner/toolchain.json names, so it is bumped by
  # hand in one change across all three (docs/community-rules.md). Proposing
  # it for one module alone would only split the pin.
  - package-ecosystem: gomod
    directory: /runner/lint
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: honnef.co/go/tools
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The community linter's runtime keeps the same Staticcheck pin as
  # runner/lint; see the note there.
  - package-ecosystem: gomod
    directory: /runner/community
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: honnef.co/go/tools
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The template community rule authors copy (examples/rule-module). It must
  # build on runner/community's pins without moving them, which
  # scripts/test-example-rules checks, so a proposal past those pins fails CI
  # until runner/community moves first.
  - package-ecosystem: gomod
    directory: /examples/rule-module
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /runner/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The temporary Dagger Go SDK generator, locked by uv.lock. Its dagger-io
  # pin belongs to .dagger-version (scripts/test-sdk-lock keeps them equal), so
  # only the generator's other dependencies update here.
  - package-ecosystem: uv
    directory: /sdk/patched-go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: dagger-io
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
