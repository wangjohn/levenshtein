version: 2
updates:
  # Workflows and the composite actions under .github/actions. Every action is
  # SHA-pinned; Dependabot updates pinned SHAs and their version comments.
  # Every ecosystem waits a week after a release before proposing it, so a
  # compromised or withdrawn version is usually gone before a PR opens.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # runner/go.mod is managed by `dagger develop`, which rewrites it on every
  # regeneration, and its OpenTelemetry replace directives are pinned on
  # purpose (scripts/test-sdk-security fails on any other version). Its
  # generated sources are gitignored, so Dependabot could not resolve the module
  # anyway. Bump it by changing .dagger-version and regenerating.

  - package-ecosystem: gomod
    directory: /runner/lint
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /runner/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The temporary Dagger Go SDK generator. Its Dagger pin belongs to
  # .dagger-version, so only the generator's own dependencies update here.
  - package-ecosystem: pip
    directory: /sdk/patched-go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
