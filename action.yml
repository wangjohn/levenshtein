name: Levenshtein verify
description: >-
  Run a named Levenshtein verification run (branch, pre-merge, main, or one of
  your own) against a checked-out repository. The pinned ref of this action is
  the pinned revision of the shared checks. See docs/consumer-ci.md.
author: wangjohn
branding:
  icon: check-circle
  color: gray-dark

inputs:
  run:
    description: >-
      Run to execute. Empty picks one from the event: schedule runs main, a push
      or a draft pull request runs branch, and anything else runs pre-merge.
    default: ''
  source:
    description: Repository directory to verify, relative to the workspace.
    default: .
  setup-go:
    description: >-
      Install the Go version this revision pins. Set to false when the job
      already provides it; the launcher still downloads the pinned toolchain.
    default: 'true'
  cache:
    description: >-
      Restore and save Levenshtein's caches with actions/cache: completed
      results on every run, and the Staticcheck analysis cache from pushes to
      the default branch and scheduled runs only. Pull requests restore both
      but write only their own results, which stay in the pull request's cache
      scope. Helper binaries are not cached; they rebuild from Go's build cache.
    default: 'true'
  annotations:
    description: >-
      Annotate the run's failing findings, and any check that did not reach a
      verdict, on the workflow run and the pull request's changed files. Needs
      no permission beyond the job's defaults.
    default: 'true'
  sarif:
    description: >-
      Path, relative to the workspace, to write a SARIF 2.1.0 file to for
      github/codeql-action/upload-sarif. Empty writes none. Uploading it is the
      calling workflow's step and needs security-events write permission there;
      this action needs none.
    default: ''

outputs:
  run:
    description: The run that was executed.
    value: ${{ steps.plan.outputs.run }}
  report:
    description: Path to the JSON report the run printed.
    value: ${{ steps.plan.outputs.report }}
  sarif:
    description: Path to the SARIF file, when the sarif input asked for one and it was written.
    value: ${{ steps.sarif.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Choose the run
      id: plan
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        DRAFT: ${{ github.event.pull_request.draft }}
        REQUESTED: ${{ inputs.run }}
        LEVENSHTEIN: ${{ github.action_path }}
      run: |
        run=$REQUESTED
        if [[ -z $run ]]; then
          run=pre-merge
          if [[ "$EVENT" == schedule ]]; then
            run=main
          elif [[ "$EVENT" == push || "$DRAFT" == true ]]; then
            run=branch
          fi
        fi
        # Staticcheck salts its cache with a hash of the linter binary, so a
        # cache built by another linter only misses. Key it on what builds the
        # linter; hashFiles cannot read the action's own files.
        linter=$(cd "$LEVENSHTEIN" && find .go-version runner/toolchain.json runner/lint -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -c1-16)
        {
          echo "run=$run"
          echo "report=$RUNNER_TEMP/levenshtein-$run.json"
          echo "cache-dir=$RUNNER_TEMP/levenshtein-cache"
          echo "linter=$linter"
        } >> "$GITHUB_OUTPUT"
    - name: Set up the pinned Go
      if: ${{ inputs.setup-go == 'true' }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/.go-version
        # setup-go hashes only workspace files, so key on the application's
        # manifests; a repository without go.sum just skips this cache.
        cache-dependency-path: ${{ inputs.source }}/**/go.sum
    # Only the result records are saved per commit. The cache directory also
    # holds helper binaries and Staticcheck data, so the record directories are
    # named rather than the whole directory: an exclusion (!path) does not
    # apply beneath a directory the pattern already includes.
    - name: Restore Levenshtein results
      id: cache
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.plan.outputs.cache-dir }}/results
          ${{ steps.plan.outputs.cache-dir }}/stages
          ${{ steps.plan.outputs.cache-dir }}/stat
        # Seed from the newest entry for this job: every result is re-keyed by
        # its fingerprint before reuse, so a stale directory can only help.
        key: levenshtein-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
        restore-keys: levenshtein-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
    - name: Restore Staticcheck cache
      id: staticcheck
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.cache-dir }}/staticcheck
        key: levenshtein-staticcheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.linter }}-${{ github.sha }}
        restore-keys: levenshtein-staticcheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.plan.outputs.linter }}-
    - name: Verify
      id: verify
      shell: bash
      env:
        LEVENSHTEIN: ${{ github.action_path }}
        RUN: ${{ steps.plan.outputs.run }}
        REPORT: ${{ steps.plan.outputs.report }}
        CACHE_DIR: ${{ steps.plan.outputs.cache-dir }}
        SOURCE: ${{ inputs.source }}
        NO_COLOR: '1'
      run: |
        mkdir -p "$CACHE_DIR"
        "$LEVENSHTEIN/verify" "$RUN" --source "$SOURCE" --cache-dir "$CACHE_DIR" | tee "$REPORT"
    # The report is rendered from the saved JSON rather than by running again,
    # so these steps never change the verdict the Verify step already gave.
    # Workflow commands escape every value, so a message or file name taken
    # from the verified source cannot end an annotation or start a command.
    - name: Annotate findings
      if: ${{ !cancelled() && inputs.annotations == 'true' && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') }}
      shell: bash
      env:
        LEVENSHTEIN: ${{ github.action_path }}
        REPORT: ${{ steps.plan.outputs.report }}
        SOURCE: ${{ inputs.source }}
      run: |
        if [[ -s $REPORT ]]; then
          "$LEVENSHTEIN/verify" --render "$REPORT" --format github --path-prefix "$SOURCE"
        fi
    - name: Write SARIF
      id: sarif
      if: ${{ !cancelled() && inputs.sarif != '' && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') }}
      shell: bash
      env:
        LEVENSHTEIN: ${{ github.action_path }}
        REPORT: ${{ steps.plan.outputs.report }}
        SOURCE: ${{ inputs.source }}
        SARIF: ${{ inputs.sarif }}
      run: |
        if [[ -s $REPORT ]]; then
          mkdir -p "$(dirname -- "$SARIF")"
          "$LEVENSHTEIN/verify" --render "$REPORT" --format sarif --path-prefix "$SOURCE" > "$SARIF"
          echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"
        fi
    # The summary lists at most 50 failing findings; the annotations, the SARIF
    # file, and the JSON report (the report output) have all of them.
    - name: Summarize
      if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') }}
      shell: bash
      env:
        RUN: ${{ steps.plan.outputs.run }}
        REPORT: ${{ steps.plan.outputs.report }}
        SOURCE: ${{ inputs.source }}
      run: |
        {
          echo "### Levenshtein \`$RUN\`"
          echo
          echo '| Check | Status |'
          echo '| --- | --- |'
          jq -r '.results[]? | "| `\(.id)` | \(.status) |"' "$REPORT" || echo '| (no report) | error |'
          findings=$(jq -r --arg prefix "$SOURCE" '
            [.results[]? | .details.findings[]?
              | select(.code != null and .location != null and .baselined != true)
              | "\(if $prefix == "." or $prefix == "" then "" else "\($prefix)/" end)\(.location.file):\(.location.line): \(.code) \(.message | split("\n")[0])"]
            | (.[:50][]), (if length > 50 then "... and \(length - 50) more" else empty end)' "$REPORT" 2> /dev/null || true)
          if [[ -n $findings ]]; then
            echo
            echo '#### Failing findings'
            echo
            echo '```text'
            echo "$findings"
            echo '```'
          fi
          baselined=$(jq -r '.baseline.baselined // 0' "$REPORT" 2> /dev/null || echo 0)
          if [[ $baselined != 0 ]]; then
            echo
            echo "$baselined findings are accepted by the baseline and not listed."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Save Levenshtein results
      if: >-
        ${{ !cancelled() && inputs.cache == 'true' &&
        (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') &&
        steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.plan.outputs.cache-dir }}/results
          ${{ steps.plan.outputs.cache-dir }}/stages
          ${{ steps.plan.outputs.cache-dir }}/stat
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Check for Staticcheck data
      id: analysis
      if: ${{ !cancelled() && inputs.cache == 'true' }}
      shell: bash
      env:
        DIR: ${{ steps.plan.outputs.cache-dir }}/staticcheck
      run: |
        if [[ -d $DIR ]] && [[ -n $(ls -A "$DIR") ]]; then
          echo 'present=true' >> "$GITHUB_OUTPUT"
        fi
    # Only trusted default-branch runs write analysis data; pull requests,
    # including forks, restore it and never contribute to it. A scheduled run
    # always runs on the default branch, and its payload has no repository.
    - name: Save Staticcheck cache
      if: >-
        ${{ !cancelled() && inputs.cache == 'true' &&
        (github.event_name == 'schedule' ||
        (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
        (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') &&
        steps.staticcheck.outputs.cache-hit != 'true' &&
        steps.analysis.outputs.present == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.cache-dir }}/staticcheck
        key: ${{ steps.staticcheck.outputs.cache-primary-key }}
